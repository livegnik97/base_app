name: base_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  animate_do: ^4.2.0
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  custom_image_crop: ^0.1.1
  device_info_plus: ^13.2.0
  dio: ^5.9.1
  event_bus_riverpod: ^3.2.6
  extended_image: ^10.0.1
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_messaging_platform_interface: ^4.7.6
  flutter:
    sdk: flutter
  flutter_debouncer: ^2.1.1
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^20.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.2.2
  flutter_typeahead: ^6.0.0
  formz: ^0.8.0
  go_router: ^17.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  json_view_plus: ^1.0.0
  loading_animation_widget: ^1.3.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  mime: ^2.0.0
  path: ^1.9.1
  permission_handler: ^12.0.1
  phone_text_field: ^2.0.0
  shared_preferences: ^2.5.4
  socket_io_client: ^3.1.4
  sqflite: ^2.4.2+1
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  vibration: ^3.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_lint: ^3.1.3

dependency_overrides:
  # Parche local: evita "RenderBox was not laid out: RenderFractionalTranslation"
  # en transiciones de rutas (flutter_typeahead issues #623 y #596).
  flutter_typeahead:
    path: third_party/flutter_typeahead
  # Copia local: permite personalizar PhoneNumber con minLength/maxLength
  # para validaciones visuales en formularios.
  phone_text_field:
    path: third_party/phone_text_field

